name: Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
      tag_name:
        description: Existing GitHub release tag to upload assets to
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve release id
        id: release-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" --jq '.id')"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate Tauri signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import base64
          import binascii
          import os
          import re
          import sys

          key = os.environ.get("TAURI_SIGNING_PRIVATE_KEY", "")
          if not key.strip():
              sys.exit("TAURI_SIGNING_PRIVATE_KEY is empty.")

          compact_key = "".join(key.split())
          invalid = re.search(r"[^A-Za-z0-9+/=]", compact_key)
          if invalid:
              sys.exit(f"TAURI_SIGNING_PRIVATE_KEY contains an invalid base64 character at offset {invalid.start()}. Recreate the GitHub secret from the raw Tauri private key.")

          try:
              base64.b64decode(compact_key, validate=True)
          except binascii.Error as error:
              sys.exit(f"TAURI_SIGNING_PRIVATE_KEY is not valid base64: {error}")
          PY

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ steps.release-info.outputs.release_id }}
          tagName: ${{ inputs.tag_name }}
          args: --ci

      - name: Post-process desktop release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release-info.outputs.release_id }}
          TAG: ${{ inputs.tag_name }}
        run: |
          chmod +x .github/scripts/desktop-release-postprocess.sh
          .github/scripts/desktop-release-postprocess.sh

      - name: Verify updater release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name }}
        run: |
          chmod +x .github/scripts/verify-updater-assets.sh
          .github/scripts/verify-updater-assets.sh
