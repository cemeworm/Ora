name: Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
      tag_name:
        description: Existing GitHub release tag to upload assets to
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate Tauri signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import base64
          import binascii
          import os
          import re
          import sys

          key = os.environ.get("TAURI_SIGNING_PRIVATE_KEY", "")
          if not key.strip():
              sys.exit("TAURI_SIGNING_PRIVATE_KEY is empty.")

          compact_key = "".join(key.split())
          invalid = re.search(r"[^A-Za-z0-9+/=]", compact_key)
          if invalid:
              sys.exit(f"TAURI_SIGNING_PRIVATE_KEY contains an invalid base64 character at offset {invalid.start()}. Recreate the GitHub secret from the raw Tauri private key.")

          try:
              base64.b64decode(compact_key, validate=True)
          except binascii.Error as error:
              sys.exit(f"TAURI_SIGNING_PRIVATE_KEY is not valid base64: {error}")
          PY

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tag_name }}
          # 代码签名待后续配置：
          # 1. 加入 Apple Developer Program ($99/年)
          # 2. 设置 GitHub Secrets: APPLE_SIGNING_IDENTITY, APPLE_CERTIFICATE,
          #    APPLE_CERTIFICATE_PASSWORD, APPLE_NOTARY_USER, APPLE_NOTARY_PASSWORD, APPLE_TEAM_ID
          # 3. 取消下面注释启用签名：
          # args: --sign
          # tauriScript: pnpm tauri
