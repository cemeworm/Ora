name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_id: ${{ steps.release-info.outputs.release_id }}
      release_sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Resolve release id
        id: release-info
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" --jq '.id')"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@cemeworm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @cemeworm/shared build

      - run: pnpm --filter @cemeworm/shared publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate Tauri signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import base64
          import binascii
          import os
          import re
          import sys

          key = os.environ.get("TAURI_SIGNING_PRIVATE_KEY", "")
          if not key.strip():
              sys.exit("TAURI_SIGNING_PRIVATE_KEY is empty.")

          compact_key = "".join(key.split())
          invalid = re.search(r"[^A-Za-z0-9+/=]", compact_key)
          if invalid:
              sys.exit(f"TAURI_SIGNING_PRIVATE_KEY contains an invalid base64 character at offset {invalid.start()}. Recreate the GitHub secret from the raw Tauri private key.")

          try:
              base64.b64decode(compact_key, validate=True)
          except binascii.Error as error:
              sys.exit(f"TAURI_SIGNING_PRIVATE_KEY is not valid base64: {error}")
          PY

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.release-please.outputs.release_id }}
          tagName: ${{ needs.release-please.outputs.tag_name }}
          args: --ci

      - name: Post-process desktop release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          chmod +x .github/scripts/desktop-release-postprocess.sh
          .github/scripts/desktop-release-postprocess.sh

      - name: Verify updater release assets
        shell: bash
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          chmod +x .github/scripts/verify-updater-assets.sh
          .github/scripts/verify-updater-assets.sh
