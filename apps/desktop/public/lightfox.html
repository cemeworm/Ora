<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光狐 · Light Fox — Ora 原型</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --glow-amber: #f59e0b;
    --glow-gold: #fbbf24;
    --glow-warm: #fcd34d;
    --glow-dim: #b45309;
    --text-primary: #f5f0e8;
    --text-muted: #8b8b7a;
    --accent: #f59e0b;
    --tail-1: #f59e0b;
    --tail-2: #fbbf24;
    --tail-3: #fcd34d;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "Cormorant Garamond", "Noto Serif SC", "STSong", "Songti SC", Georgia, serif;
    overflow: hidden;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Background canvas for particles */
  #particles-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* Noise overlay */
  .noise {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* Main container */
  .container {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 48px;
  }

  /* Fox stage */
  .fox-stage {
    position: relative;
    width: 420px;
    height: 480px;
  }

  /* Glow aura behind fox */
  .aura {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245,158,11,0.12) 0%, rgba(245,158,11,0.04) 40%, transparent 70%);
    pointer-events: none;
    transition: all 1.2s var(--ease-out-expo);
  }

  .aura.active {
    width: 380px;
    height: 380px;
    background: radial-gradient(circle, rgba(245,158,11,0.22) 0%, rgba(251,191,36,0.08) 35%, transparent 65%);
  }

  .aura.thinking {
    animation: aura-pulse 1.6s ease-in-out infinite;
  }

  @keyframes aura-pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
    50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
  }

  /* Fox SVG */
  .fox-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 18px rgba(245,158,11,0.25));
    transition: filter 0.8s var(--ease-out-expo);
  }

  .fox-svg.active {
    filter: drop-shadow(0 0 32px rgba(245,158,11,0.45)) drop-shadow(0 0 60px rgba(251,191,36,0.2));
  }

  /* Tail animations */
  .tail-1 { animation: tail-sway-1 3.5s ease-in-out infinite; transform-origin: 200px 320px; }
  .tail-2 { animation: tail-sway-2 4.2s ease-in-out infinite 0.3s; transform-origin: 210px 310px; }
  .tail-3 { animation: tail-sway-3 3.8s ease-in-out infinite 0.6s; transform-origin: 205px 315px; }

  @keyframes tail-sway-1 {
    0%, 100% { transform: rotate(-2deg) translateX(0); }
    25% { transform: rotate(3deg) translateX(3px); }
    50% { transform: rotate(-1deg) translateX(-2px); }
    75% { transform: rotate(4deg) translateX(4px); }
  }

  @keyframes tail-sway-2 {
    0%, 100% { transform: rotate(2deg) translateX(0); }
    30% { transform: rotate(-3deg) translateX(-3px); }
    60% { transform: rotate(1deg) translateX(2px); }
    85% { transform: rotate(-4deg) translateX(-4px); }
  }

  @keyframes tail-sway-3 {
    0%, 100% { transform: rotate(-1deg) translateX(0); }
    35% { transform: rotate(2deg) translateX(2px); }
    65% { transform: rotate(-3deg) translateX(-3px); }
    90% { transform: rotate(3deg) translateX(3px); }
  }

  /* Thinking state - tails more active */
  .fox-svg.thinking .tail-1 { animation-duration: 1.2s; }
  .fox-svg.thinking .tail-2 { animation-duration: 1.4s; }
  .fox-svg.thinking .tail-3 { animation-duration: 1.1s; }

  /* Eye glow */
  .eye-glow {
    transition: opacity 0.6s var(--ease-out-expo);
  }

  .eye-glow.dim { opacity: 0.4; }
  .eye-glow.bright { opacity: 1; }

  /* Orbiting particles */
  .orbit-particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--glow-gold);
    box-shadow: 0 0 8px var(--glow-amber), 0 0 16px var(--glow-amber);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  .orbit-particle.visible { opacity: 0.8; }

  /* State indicators */
  .state-controls {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .state-btn {
    background: var(--surface);
    border: 1px solid rgba(245,158,11,0.2);
    color: var(--text-muted);
    padding: 10px 22px;
    border-radius: 24px;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.35s var(--ease-out-expo);
    letter-spacing: 0.04em;
    position: relative;
    overflow: hidden;
  }

  .state-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(245,158,11,0.1), transparent);
    opacity: 0;
    transition: opacity 0.35s ease;
  }

  .state-btn:hover {
    border-color: rgba(245,158,11,0.5);
    color: var(--text-primary);
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(245,158,11,0.1);
  }

  .state-btn:hover::before { opacity: 1; }

  .state-btn.active {
    background: rgba(245,158,11,0.12);
    border-color: var(--glow-amber);
    color: var(--glow-gold);
    box-shadow: 0 0 24px rgba(245,158,11,0.15);
  }

  .state-btn .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
    transition: all 0.35s ease;
  }

  .state-btn[data-state="idle"] .dot { background: #6b7280; box-shadow: 0 0 4px #6b7280; }
  .state-btn[data-state="thinking"] .dot { background: var(--glow-amber); box-shadow: 0 0 8px var(--glow-amber); }
  .state-btn[data-state="active"] .dot { background: var(--glow-gold); box-shadow: 0 0 12px var(--glow-gold); }
  .state-btn[data-state="done"] .dot { background: #34d399; box-shadow: 0 0 8px #34d399; }

  .state-btn.active[data-state="thinking"] .dot { animation: dot-pulse 0.8s ease-in-out infinite; }
  .state-btn.active[data-state="active"] .dot { animation: dot-pulse 0.5s ease-in-out infinite; }

  @keyframes dot-pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.8); opacity: 0.6; }
  }

  /* Title */
  .title-area {
    text-align: center;
  }

  .title {
    font-size: 36px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.06em;
    line-height: 1.3;
  }

  .title .fox-char {
    display: inline-block;
    background: linear-gradient(135deg, var(--glow-amber), var(--glow-gold), var(--glow-warm));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-size: 40px;
  }

  .subtitle {
    font-size: 15px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    margin-top: 6px;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #6b7280;
    transition: all 0.5s ease;
  }

  .status-dot.thinking { background: var(--glow-amber); box-shadow: 0 0 10px var(--glow-amber); animation: dot-pulse 0.8s ease-in-out infinite; }
  .status-dot.active { background: var(--glow-gold); box-shadow: 0 0 14px var(--glow-gold); animation: dot-pulse 0.5s ease-in-out infinite; }
  .status-dot.done { background: #34d399; box-shadow: 0 0 10px #34d399; }

  .status-text {
    transition: color 0.5s ease;
  }

  /* Deerflow badge */
  .deerflow-badge {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 20;
    font-size: 11px;
    color: rgba(139,139,122,0.35);
    letter-spacing: 0.1em;
    text-decoration: none;
    transition: all 0.4s ease;
    font-family: "Cormorant Garamond", Georgia, serif;
  }

  .deerflow-badge:hover {
    color: rgba(205,180,140,0.7);
    text-shadow: 0 0 12px rgba(245,158,11,0.2);
  }

  /* Spark burst animation for done state */
  .spark {
    position: absolute;
    width: 2px;
    height: 8px;
    background: var(--glow-gold);
    border-radius: 1px;
    pointer-events: none;
    opacity: 0;
    box-shadow: 0 0 6px var(--glow-amber);
  }

  .spark.burst {
    animation: spark-burst 1.2s var(--ease-out-expo) forwards;
  }

  @keyframes spark-burst {
    0% { opacity: 0; transform: translate(0, 0) scale(0); }
    20% { opacity: 1; transform: translate(var(--sx), var(--sy)) scale(1); }
    100% { opacity: 0; transform: translate(calc(var(--sx) * 2.5), calc(var(--sy) * 2.5)) scale(0); }
  }

  /* Responsive */
  @media (max-width: 480px) {
    .fox-stage { width: 300px; height: 360px; }
    .aura { width: 240px; height: 240px; }
    .aura.active { width: 280px; height: 280px; }
    .title { font-size: 26px; }
    .title .fox-char { font-size: 30px; }
    .state-btn { padding: 8px 16px; font-size: 13px; }
  }
</style>
</head>
<body>

<!-- Particle canvas -->
<canvas id="particles-canvas"></canvas>

<!-- Noise texture -->
<div class="noise"></div>

<!-- Main -->
<div class="container">
  <!-- Title -->
  <div class="title-area">
    <h1 class="title"><span class="fox-char">光</span>狐 Light Fox</h1>
    <p class="subtitle">O R A &nbsp;·&nbsp; M A S C O T</p>
  </div>

  <!-- Fox Stage -->
  <div class="fox-stage" id="foxStage">
    <div class="aura" id="aura"></div>

    <!-- SVG Fox -->
    <svg class="fox-svg" id="foxSvg" viewBox="0 0 420 480" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradients -->
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fbbf24"/>
          <stop offset="50%" stop-color="#f59e0b"/>
          <stop offset="100%" stop-color="#d97706"/>
        </linearGradient>
        <linearGradient id="tailGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
          <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#fcd34d" stop-opacity="0.9"/>
        </linearGradient>
        <linearGradient id="tailGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#d97706" stop-opacity="0.3"/>
          <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.9"/>
        </linearGradient>
        <linearGradient id="tailGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#b45309" stop-opacity="0.3"/>
          <stop offset="50%" stop-color="#d97706" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.9"/>
        </linearGradient>
        <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fef3c7"/>
          <stop offset="100%" stop-color="#fbbf24"/>
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="softGlow">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- Tails group -->
      <g class="tail-1">
        <path d="M195 300 C160 250, 100 220, 70 160 C60 130, 65 100, 80 80"
              fill="none" stroke="url(#tailGrad1)" stroke-width="3" stroke-linecap="round"
              filter="url(#glow)"/>
        <path d="M195 300 C155 255, 105 225, 75 165 C65 135, 70 108, 83 85"
              fill="none" stroke="url(#tailGrad1)" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
      </g>
      <g class="tail-2">
        <path d="M210 300 C240 240, 290 210, 330 150 C345 120, 342 85, 328 65"
              fill="none" stroke="url(#tailGrad2)" stroke-width="3" stroke-linecap="round"
              filter="url(#glow)"/>
        <path d="M210 300 C235 245, 282 215, 322 155 C338 125, 335 92, 323 70"
              fill="none" stroke="url(#tailGrad2)" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
      </g>
      <g class="tail-3">
        <path d="M200 310 C180 280, 130 280, 95 250 C70 230, 55 200, 60 170"
              fill="none" stroke="url(#tailGrad3)" stroke-width="2.5" stroke-linecap="round"
              filter="url(#glow)"/>
        <path d="M200 310 C178 282, 132 282, 98 253 C73 233, 60 205, 63 175"
              fill="none" stroke="url(#tailGrad3)" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
      </g>

      <!-- Body -->
      <path d="M185 220 C170 240, 165 280, 180 330 C190 360, 200 370, 210 360 C225 340, 230 300, 220 270 C240 260, 260 250, 280 235 C290 225, 290 215, 280 205 C260 195, 220 195, 185 220Z"
            fill="url(#bodyGrad)" opacity="0.15" filter="url(#softGlow)"/>

      <!-- Body outline -->
      <path d="M185 220 C170 240, 165 280, 180 330 C190 360, 200 370, 210 360 C225 340, 230 300, 220 270"
            fill="none" stroke="url(#bodyGrad)" stroke-width="2.5" stroke-linecap="round"
            filter="url(#glow)"/>

      <!-- Chest / neck -->
      <path d="M185 220 C200 210, 230 205, 260 200"
            fill="none" stroke="url(#bodyGrad)" stroke-width="2" stroke-linecap="round"
            filter="url(#glow)" opacity="0.7"/>

      <!-- Head -->
      <!-- Left ear -->
      <path d="M178 185 L158 120 L185 165" fill="url(#bodyGrad)" opacity="0.2" filter="url(#softGlow)"/>
      <path d="M178 185 L158 120 L185 165" fill="none" stroke="url(#bodyGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <!-- Right ear -->
      <path d="M242 180 L268 118 L252 165" fill="url(#bodyGrad)" opacity="0.2" filter="url(#softGlow)"/>
      <path d="M242 180 L268 118 L252 165" fill="none" stroke="url(#bodyGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

      <!-- Face -->
      <path d="M168 200 C168 160, 190 140, 210 138 C230 140, 258 160, 258 200 C258 230, 240 250, 210 252 C190 250, 168 230, 168 200Z"
            fill="url(#bodyGrad)" opacity="0.12" filter="url(#softGlow)"/>
      <path d="M168 200 C168 160, 190 140, 210 138 C230 140, 258 160, 258 200 C258 230, 240 250, 210 252 C190 250, 168 230, 168 200Z"
            fill="none" stroke="url(#bodyGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

      <!-- Eyes -->
      <ellipse class="eye-glow" cx="192" cy="190" rx="8" ry="6" fill="url(#eyeGrad)" filter="url(#glow)"/>
      <ellipse class="eye-glow" cx="228" cy="190" rx="8" ry="6" fill="url(#eyeGrad)" filter="url(#glow)"/>
      <!-- Eye pupils -->
      <ellipse cx="193" cy="190" rx="4" ry="5" fill="#0a0a0f"/>
      <ellipse cx="227" cy="190" rx="4" ry="5" fill="#0a0a0f"/>
      <!-- Eye highlights -->
      <circle cx="195" cy="187" r="1.5" fill="#fef3c7" opacity="0.9"/>
      <circle cx="229" cy="187" r="1.5" fill="#fef3c7" opacity="0.9"/>

      <!-- Nose -->
      <path d="M207 202 L210 208 L213 202" fill="none" stroke="url(#bodyGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

      <!-- Mouth - subtle curve -->
      <path d="M200 215 Q210 222 220 215" fill="none" stroke="url(#bodyGrad)" stroke-width="1" stroke-linecap="round" opacity="0.4"/>

      <!-- Whiskers left -->
      <line x1="178" y1="205" x2="148" y2="198" stroke="url(#bodyGrad)" stroke-width="0.8" stroke-linecap="round" opacity="0.35"/>
      <line x1="178" y1="210" x2="145" y2="212" stroke="url(#bodyGrad)" stroke-width="0.8" stroke-linecap="round" opacity="0.35"/>

      <!-- Whiskers right -->
      <line x1="248" y1="205" x2="278" y2="198" stroke="url(#bodyGrad)" stroke-width="0.8" stroke-linecap="round" opacity="0.35"/>
      <line x1="248" y1="210" x2="281" y2="212" stroke="url(#bodyGrad)" stroke-width="0.8" stroke-linecap="round" opacity="0.35"/>

      <!-- Front paws -->
      <ellipse cx="190" cy="362" rx="8" ry="5" fill="url(#bodyGrad)" opacity="0.18" filter="url(#softGlow)"/>
      <ellipse cx="190" cy="362" rx="8" ry="5" fill="none" stroke="url(#bodyGrad)" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)"/>
      <ellipse cx="215" cy="358" rx="8" ry="5" fill="url(#bodyGrad)" opacity="0.18" filter="url(#softGlow)"/>
      <ellipse cx="215" cy="358" rx="8" ry="5" fill="none" stroke="url(#bodyGrad)" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)"/>

      <!-- Constellation dots along body -->
      <circle cx="185" cy="235" r="2" fill="var(--glow-gold)" opacity="0.5"/>
      <circle cx="195" cy="260" r="1.8" fill="var(--glow-gold)" opacity="0.4"/>
      <circle cx="200" cy="285" r="2" fill="var(--glow-gold)" opacity="0.5"/>
      <circle cx="192" cy="310" r="1.5" fill="var(--glow-gold)" opacity="0.35"/>
    </svg>

    <!-- Orbit particles container -->
    <div id="orbitContainer"></div>

    <!-- Spark container -->
    <div id="sparkContainer"></div>
  </div>

  <!-- State controls -->
  <div class="state-controls">
    <button class="state-btn active" data-state="idle" onclick="setState('idle')">
      <span class="dot"></span>待机 Idle
    </button>
    <button class="state-btn" data-state="thinking" onclick="setState('thinking')">
      <span class="dot"></span>思考 Thinking
    </button>
    <button class="state-btn" data-state="active" onclick="setState('active')">
      <span class="dot"></span>编排 Active
    </button>
    <button class="state-btn" data-state="done" onclick="setState('done')">
      <span class="dot"></span>完成 Done
    </button>
  </div>

  <!-- Status -->
  <div class="status-bar">
    <span class="status-dot" id="statusDot"></span>
    <span class="status-text" id="statusText">待机中 · Ora 根代理就绪</span>
  </div>
</div>

<!-- Deerflow badge -->
<a href="https://deerflow.tech" target="_blank" class="deerflow-badge">✦ Deerflow</a>

<script>
  // ===== Particle Background =====
  const canvas = document.getElementById('particles-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  const PARTICLE_COUNT = 80;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  class Particle {
    constructor() {
      this.reset();
    }
    reset() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.size = Math.random() * 1.5 + 0.5;
      this.speedX = (Math.random() - 0.5) * 0.25;
      this.speedY = (Math.random() - 0.5) * 0.25;
      this.opacity = Math.random() * 0.5 + 0.1;
      this.fadeSpeed = (Math.random() - 0.5) * 0.003;
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      this.opacity += this.fadeSpeed;
      if (this.opacity > 0.6) this.fadeSpeed = -Math.abs(this.fadeSpeed);
      if (this.opacity < 0.05) this.fadeSpeed = Math.abs(this.fadeSpeed);
      if (this.x < -10 || this.x > canvas.width + 10 || this.y < -10 || this.y > canvas.height + 10) {
        this.reset();
      }
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(245,158,11,${this.opacity})`;
      ctx.fill();
      if (this.opacity > 0.35) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(245,158,11,${this.opacity * 0.08})`;
        ctx.fill();
      }
    }
  }

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push(new Particle());
  }

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  // ===== Fox State Machine =====
  let currentState = 'idle';
  let orbitParticles = [];
  let orbitAnimationId = null;

  const foxSvg = document.getElementById('foxSvg');
  const aura = document.getElementById('aura');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const orbitContainer = document.getElementById('orbitContainer');
  const sparkContainer = document.getElementById('sparkContainer');

  const stateConfig = {
    idle: {
      svgClass: '',
      auraClass: '',
      dotClass: '',
      status: '待机中 · Ora 根代理就绪',
      orbitCount: 0,
    },
    thinking: {
      svgClass: 'thinking',
      auraClass: 'thinking',
      dotClass: 'thinking',
      status: '思考中 · 分析意图与规划路径...',
      orbitCount: 3,
    },
    active: {
      svgClass: 'active',
      auraClass: 'active',
      dotClass: 'active',
      status: '编排执行 · 委派 Mode Agent 协同工作',
      orbitCount: 5,
    },
    done: {
      svgClass: 'active',
      auraClass: 'active',
      dotClass: 'done',
      status: '完成 ✓ · 整合结果，交付用户',
      orbitCount: 6,
    },
  };

  function clearOrbitParticles() {
    orbitParticles = [];
    orbitContainer.innerHTML = '';
    if (orbitAnimationId) {
      cancelAnimationFrame(orbitAnimationId);
      orbitAnimationId = null;
    }
  }

  function createOrbitParticles(count) {
    clearOrbitParticles();
    const stage = document.getElementById('foxStage');
    const stageRect = stage.getBoundingClientRect();
    const cx = stageRect.width / 2;
    const cy = stageRect.height / 2 - 20;

    for (let i = 0; i < count; i++) {
      const particle = document.createElement('div');
      particle.className = 'orbit-particle';
      particle.style.position = 'absolute';
      orbitContainer.appendChild(particle);

      orbitParticles.push({
        el: particle,
        angle: (Math.PI * 2 / count) * i,
        radius: 100 + Math.random() * 90,
        speed: 0.008 + Math.random() * 0.015,
        cx,
        cy,
      });

      // Fade in
      requestAnimationFrame(() => {
        particle.classList.add('visible');
      });
    }

    function animate() {
      orbitParticles.forEach(p => {
        p.angle += p.speed;
        const x = p.cx + Math.cos(p.angle) * p.radius;
        const y = p.cy + Math.sin(p.angle) * p.radius * 0.6;
        p.el.style.left = x + 'px';
        p.el.style.top = y + 'px';
      });
      orbitAnimationId = requestAnimationFrame(animate);
    }

    if (count > 0) {
      orbitAnimationId = requestAnimationFrame(animate);
    }
  }

  function burstSparks() {
    sparkContainer.innerHTML = '';
    const stage = document.getElementById('foxStage');
    const stageRect = stage.getBoundingClientRect();
    const cx = stageRect.width / 2;
    const cy = stageRect.height / 2 - 20;
    const count = 30;

    for (let i = 0; i < count; i++) {
      const spark = document.createElement('div');
      spark.className = 'spark';
      const angle = (Math.PI * 2 / count) * i;
      const distance = 60 + Math.random() * 120;
      spark.style.setProperty('--sx', Math.cos(angle) * distance + 'px');
      spark.style.setProperty('--sy', Math.sin(angle) * distance + 'px');
      spark.style.left = cx + 'px';
      spark.style.top = cy + 'px';
      spark.style.animationDelay = Math.random() * 0.3 + 's';
      sparkContainer.appendChild(spark);

      requestAnimationFrame(() => {
        spark.classList.add('burst');
      });

      // Clean up
      setTimeout(() => spark.remove(), 1500);
    }
  }

  function setState(state) {
    currentState = state;
    const config = stateConfig[state];

    // Update SVG
    foxSvg.className = 'fox-svg ' + config.svgClass;

    // Update aura
    aura.className = 'aura ' + config.auraClass;

    // Update status dot
    statusDot.className = 'status-dot ' + config.dotClass;

    // Update status text
    statusText.textContent = config.status;
    if (state === 'done') statusText.style.color = '#34d399';
    else statusText.style.color = '';

    // Update orbit particles
    createOrbitParticles(config.orbitCount);

    // Sparks on done
    if (state === 'done') {
      burstSparks();
    }

    // Update buttons
    document.querySelectorAll('.state-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.state === state);
    });

    // Eye glow
    const eyes = document.querySelectorAll('.eye-glow');
    eyes.forEach(eye => {
      if (state === 'idle') {
        eye.classList.add('dim');
        eye.classList.remove('bright');
      } else {
        eye.classList.remove('dim');
        eye.classList.add('bright');
      }
    });
  }

  // Initialize
  setState('idle');

  // Hover interaction on fox
  const foxStage = document.getElementById('foxStage');
  foxStage.addEventListener('mouseenter', () => {
    if (currentState === 'idle') {
      foxSvg.style.filter = 'drop-shadow(0 0 24px rgba(245,158,11,0.35))';
      aura.style.opacity = '1.2';
      aura.style.transform = 'translate(-50%, -50%) scale(1.05)';
    }
  });

  foxStage.addEventListener('mouseleave', () => {
    if (currentState === 'idle') {
      foxSvg.style.filter = '';
      aura.style.opacity = '';
      aura.style.transform = '';
    }
  });

  // Click fox to cycle
  foxStage.addEventListener('click', () => {
    const states = ['idle', 'thinking', 'active', 'done'];
    const nextIndex = (states.indexOf(currentState) + 1) % states.length;
    setState(states[nextIndex]);
  });
</script>
</body>
</html>
